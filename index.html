<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi App Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; }
        .app-container { display: flex; flex-direction: column; width: 100%; height: 100vh; }
        
        .content-frame { width: 100%; height: calc(100vh - 65px); border: none; background: #000; display: none; }
        .content-frame.active-frame { display: block; }
        
        .nav-bar {
            height: 65px;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: fixed;
            bottom: 0; left: 0; width: 100%; z-index: 1000;
        }
        .nav-btn {
            background: none; border: none; color: #888; font-size: 11px;
            display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
            transition: all 0.3s ease; flex: 1;
        }
        .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }
        .nav-btn.active { color: #ff0033; transform: scale(1.05); }

        #home-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: calc(100vh - 65px);
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: none; flex-direction: column; padding: 20px; overflow-y: auto; z-index: 500;
        }
        #home-screen.active-screen { display: flex; }
        
        .header-title { font-size: 18px; font-weight: 700; margin: 15px 0; color: #ff3333; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        .cards-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
        
        .portal-card {
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px); 
            padding: 16px 18px; 
            border-radius: 16px; 
            cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s ease;
        }
        .portal-card:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.12); }
        .portal-card h3 { font-size: 15px; margin-bottom: 3px; color: #fff; font-weight: 600; }
        .portal-card p { font-size: 11px; color: #aaa; }
        .portal-card span { font-size: 22px; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 1. YouTube Frame (Starts by default) -->
        <iframe id="youtubeFrame" class="content-frame active-frame" src="https://m.youtube.com"></iframe>

        <!-- 2. YouTube Music / Portal Frame -->
        <iframe id="mediaFrame" class="content-frame" src="https://music.youtube.com"></iframe>
        
        <!-- 3. Home Screen (Portals) -->
        <div id="home-screen">
            <div class="header-title">🛡️ Media Hub & Portals</div>
            <div class="cards-grid">
                <div class="portal-card" onclick="openMediaTab('https://music.youtube.com')">
                    <div><h3>🎵 YouTube Music</h3><p>Open YouTube Music player</p></div><span>🎶</span>
                </div>
                <div class="portal-card" onclick="openMediaTab('https://www.allsitehub.site/')">
                    <div><h3>🎬 AllSiteHub Movies</h3><p>Open movies & series portal</p></div><span>➡️</span>
                </div>
                <div class="portal-card" onclick="openMediaTab('https://www.subdubanime.site/')">
                    <div><h3>⛩️ SubDubAnime</h3><p>Open anime portal</p></div><span>➡️</span>
                </div>
            </div>
        </div>
        
        <!-- Bottom Navigation Bar -->
        <div class="nav-bar">
            <button class="nav-btn active" id="btn-youtube" onclick="switchTab('youtube')">
                <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>YouTube
            </button>
            <button class="nav-btn" id="btn-music" onclick="switchTab('music')">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>YT Music
            </button>
            <button class="nav-btn" id="btn-home" onclick="switchTab('home')">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Portals
            </button>
        </div>
    </div>
    
    <script>
        const youtubeFrame = document.getElementById('youtubeFrame');
        const mediaFrame = document.getElementById('mediaFrame');
        const homeScreen = document.getElementById('home-screen');
        
        const btnYoutube = document.getElementById('btn-youtube');
        const btnMusic = document.getElementById('btn-music');
        const btnHome = document.getElementById('btn-home');
        
        function switchTab(tab) {
            youtubeFrame.classList.remove('active-frame');
            mediaFrame.classList.remove('active-frame');
            homeScreen.classList.remove('active-screen');
            
            btnYoutube.classList.remove('active');
            btnMusic.classList.remove('active');
            btnHome.classList.remove('active');
            
            if (tab === 'youtube') {
                youtubeFrame.classList.add('active-frame');
                btnYoutube.classList.add('active');
            } else if (tab === 'music') {
                mediaFrame.classList.add('active-frame');
                btnMusic.classList.add('active');
            } else if (tab === 'home') {
                homeScreen.classList.add('active-screen');
                btnHome.classList.add('active');
            }
        }

        function openMediaTab(url) {
            mediaFrame.src = url;
            switchTab('music');
        }
    </script>
</body>
</html>
