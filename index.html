<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi App Launcher</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; background: #0a0a0a; color: #fff; display: flex; flex-direction: column; }
        
        .header-title { font-size: 20px; font-weight: 700; margin: 25px 0 15px 0; color: #ff3333; text-align: center; text-transform: uppercase; }
        .cards-grid { display: grid; grid-template-columns: 1fr; gap: 14px; padding: 0 20px; overflow-y: auto; flex: 1; }
        
        .portal-card {
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px); 
            padding: 18px 20px; 
            border-radius: 16px; 
            cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s ease;
        }
        .portal-card:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.15); }
        .portal-card h3 { font-size: 16px; margin-bottom: 4px; color: #fff; font-weight: 600; }
        .portal-card p { font-size: 12px; color: #aaa; }
        .portal-card span { font-size: 22px; }

        .nav-bar {
            height: 68px;
            background: rgba(15, 15, 15, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            display: flex; justify-content: space-around; align-items: center;
        }
        .nav-btn {
            background: none; border: none; color: #ff0033; font-size: 12px; font-weight: 600;
            display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
        }
        .nav-btn svg { width: 24px; height: 24px; fill: currentColor; }
    </style>
</head>
<body>
    <div class="header-title">🚀 Fast Media Hub</div>
    
    <div class="cards-grid">
        <div class="portal-card" onclick="openApp('https://m.youtube.com')">
            <div><h3>▶️ YouTube Mobile</h3><p>Open YouTube App/Site directly</p></div><span>🔥</span>
        </div>
        <div class="portal-card" onclick="openApp('https://music.youtube.com')">
            <div><h3>🎵 YouTube Music</h3><p>Open YouTube Music directly</p></div><span>🎶</span>
        </div>
        <div class="portal-card" onclick="openApp('https://www.allsitehub.site/')">
            <div><h3>🎬 AllSiteHub Movies</h3><p>Discover Movies & Shows</p></div><span>➡️</span>
        </div>
        <div class="portal-card" onclick="openApp('https://www.subdubanime.site/')">
            <div><h3>⛩️ SubDubAnime</h3><p>Sub & Dub Anime Portal</p></div><span>➡️</span>
        </div>
        <div class="portal-card" onclick="openApp('https://1.1.1.1/')">
            <div><h3>🛡️ 1.1.1.1 DNS / VPN</h3><p>Fast & Secure Connection</p></div><span>🔒</span>
        </div>
    </div>
    
    <div class="nav-bar">
        <button class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home Dashboard
        </button>
    </div>

    <script>
        function openApp(url) {
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
