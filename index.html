<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi App Hub - Fixed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; background: #070707; color: #fff; display: flex; flex-direction: column; overflow: hidden; }
        
        .header-section {
            padding: 25px 20px 15px 20px;
            text-align: center;
        }
        .header-title { font-size: 20px; font-weight: 700; color: #ff3333; text-transform: uppercase; letter-spacing: 1px; }
        .header-subtitle { font-size: 12px; color: #aaa; margin-top: 5px; }

        .cards-grid { 
            display: flex; flex-direction: column; gap: 12px; 
            padding: 10px 20px; overflow-y: auto; flex: 1; 
        }
        
        .portal-card {
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            padding: 16px 18px; 
            border-radius: 16px; 
            cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s ease;
        }
        .portal-card:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.15); }
        .portal-card h3 { font-size: 15px; margin-bottom: 3px; color: #fff; font-weight: 600; }
        .portal-card p { font-size: 11px; color: #aaa; }
        .portal-card span { font-size: 22px; }

        .footer-note {
            text-align: center; padding: 12px; font-size: 11px; color: #666;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div class="header-section">
        <div class="header-title">🛡️ فکسڈ میڈیا ہب</div>
        <div class="header-subtitle">بغیر کسی ایرر کے فعال لنکس</div>
    </div>
    
    <div class="cards-grid">
        <div class="portal-card" onclick="openApp('https://invidious.io/api/redirect?url=https%3A%2F%2Fwww.youtube.com')">
            <div><h3>▶️ ایڈ فری یوٹیوب (انویڈیوس سرور)</h3><p>اشتہارات کے بغیر تیز ترین اسٹریمنگ</p></div><span>🔥</span>
        </div>
        <div class="portal-card" onclick="openApp('https://piped.video')">
            <div><h3>▶️ پائپڈ یوٹیوب (متبادل)</h3><p>بغیر اشتہار ویڈیو پلیئر</p></div><span>⚡</span>
        </div>
        <div class="portal-card" onclick="openApp('https://music.youtube.com')">
            <div><h3>🎵 یوٹیوب میوزک</h3><p>آفیشل میوزک پلیئر</p></div><span>🎶</span>
        </div>
        <div class="portal-card" onclick="openApp('https://www.subdubanime.site/')">
            <div><h3>⛩️ سب ڈب انیمے</h3><p>انیمے اور کارٹون پورٹل</p></div><span>➡️</span>
        </div>
    </div>
    
    <div class="footer-note">
        100% ورکنگ لنکس اپڈیٹڈ
    </div>

    <script>
        function openApp(url) {
            window.location.href = url;
        }
    </script>
</body>
</html>
