<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi App - AdBlocked PWA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; }
        .app-container { display: flex; flex-direction: column; width: 100%; height: 100vh; }
        
        /* Ultra-Fast Transparent Viewport Frame */
        .content-frame { flex: 1; width: 100%; border: none; background: #000; }
        
        /* Premium Glassmorphism Bottom Navigation Bar */
        .nav-bar {
            height: 68px;
            background: rgba(15, 15, 15, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: fixed;
            bottom: 0; left: 0; width: 100%; z-index: 1000;
        }
        .nav-btn {
            background: none; border: none; color: #888; font-size: 11px;
            display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
            transition: all 0.3s ease;
        }
        .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }
        .nav-btn.active { color: #ff0033; transform: scale(1.05); }

        /* Transparent Glass Overlay Screen for Portals */
        #home-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: calc(100vh - 68px);
            background: rgba(10, 10, 10, 0.88);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: none; flex-direction: column; padding: 20px; overflow-y: auto; z-index: 500;
        }
        .header-title { font-size: 18px; font-weight: 700; margin: 15px 0; color: #ff3333; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        .cards-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
        
        /* Frosted Glass Action Cards */
        .portal-card {
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px); 
            padding: 16px 18px; 
            border-radius: 16px; 
            cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s ease;
        }
        .portal-card:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.12); }
        .portal-card h3 { font-size: 15px; margin-bottom: 3px; color: #fff; font-weight: 600; }
        .portal-card p { font-size: 11px; color: #aaa; }
        .portal-card span { font-size: 22px; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Direct Default: No-Ads YouTube Mobile Engine -->
        <iframe id="mainFrame" class="content-frame" src="https://piped.video" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>
        
        <!-- Portals & Music Hub -->
        <div id="home-screen">
            <div class="header-title">🛡️ Ad-Free Hub & Portals</div>
            <div class="cards-grid">
                <div class="portal-card" onclick="openSite('https://piped.video')">
                    <div><h3>▶️ YouTube (No Ads)</h3><p>اشتہارات کے بغیر یوٹیوب کا مکمل تجربہ</p></div><span>🔥</span>
                </div>
                <div class="portal-card" onclick="openSite('https://music.youtube.com')">
                    <div><h3>🎵 YouTube Music</h3><p>الگ میوزک اور گانے سنیں</p></div><span>🎶</span>
                </div>
                <div class="portal-card" onclick="openSite('https://www.allsitehub.site/')">
                    <div><h3>🎬 AllSiteHub Movies</h3><p>موویز اور شوز پورٹل</p></div><span>➡️</span>
                </div>
                <div class="portal-card" onclick="openSite('https://www.subdubanime.site/')">
                    <div><h3>⛩️ SubDubAnime</h3><p>سب اور ڈب انیمے پورٹل</p></div><span>➡️</span>
                </div>
                <div class="portal-card" onclick="openExternal('https://1.1.1.1/')">
                    <div><h3>🛡️ 1.1.1.1 DNS / VPN</h3><p>فاسٹ اور محفوظ کنکشن</p></div><span>🔒</span>
                </div>
            </div>
        </div>
        
        <!-- Glass Bottom Bar -->
        <div class="nav-bar">
            <button class="nav-btn active" id="btn-tube" onclick="switchTab('youtube')">
                <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>یوٹیوب
            </button>
            <button class="nav-btn" id="btn-home" onclick="switchTab('home')">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>پورٹلز & میوزک
            </button>
        </div>
    </div>
    
    <script>
        const iframe = document.getElementById('mainFrame');
        const homeScreen = document.getElementById('home-screen');
        const btnTube = document.getElementById('btn-tube');
        const btnHome = document.getElementById('btn-home');
        
        // Anti Popup Ad Blocker Guard
        window.open = function() { return null; };

        function switchTab(tab) {
            if (tab === 'home') {
                homeScreen.style.display = 'flex';
                btnHome.classList.add('active'); 
                btnTube.classList.remove('active');
            } else {
                homeScreen.style.display = 'none';
                btnTube.classList.add('active'); 
                btnHome.classList.remove('active');
            }
        }
        function openSite(url) {
            homeScreen.style.display = 'none';
            iframe.src = url;
            btnTube.classList.remove('active'); 
            btnHome.classList.add('active');
        }
        function openExternal(url) {
            window.location.href = url;
        }
    </script>
</body>
</html>
